name: Scala Steward
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  scala-steward:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Setup JVM
        uses: coursier/setup-action@v3.0.0
        with:
          jvm: temurin:17
      - name: Launch Scala Steward
        uses: scala-steward-org/scala-steward-action@v2.90.0
        with:
          mill-version: '1.1.6'
          repo-config: '.scala-steward.conf'
