name: Scala Steward
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  scala-steward:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v6.0.0
        with:
          java-version: 17
          distribution: temurin
      - name: Run Scala Steward
        uses: scala-steward-org/scala-steward-action@v2.96.0
        with:
          branches: main
          repo-config: .scala-steward.conf
